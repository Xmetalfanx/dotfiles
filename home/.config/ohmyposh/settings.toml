'$schema' = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
console_title_template = "{{ .Folder }}"
final_space = true
version = 4

[palette]
black = '#000000'
darkblue = '#262B44'
grey = '#333333'
green = '#0B6623'
blue = '#3333ff'
lightblue = '#4B95E9'
turquoise = '#21c7a8'
orange = '#F07623'
lightorange = '#F3AE35'
offyellow = 'rgb(228, 207, 106)'
red = '#ff3333'
lightred = '#D81E5B'
darkpurple = 'rgb(1, 22, 39)'
white = '#E0DEF4'
lighttan = 'rgb(255, 235, 149)'
themeprimarydark= 'p:darkblue'
themeprimarylight= 'p:lighttan'


[[blocks]]
alignment = "left"
type = "prompt"

# icon of tux on linux
[[blocks.segments]]
background = "p:darkblue"
foreground = "p:lighttan"
leading_diamond = "╭─"
style = "diamond"
template = " {{ if .WSL }}WSL at {{ end }}{{.Icon}}  "
trailing_diamond = ""
type = "os"
[blocks.segments.options]
windows = ""

[[blocks.segments]]
background = "#ef5350"
foreground = "p:lighttan"
powerline_symbol = ""
style = "powerline"
template = "  "
type = "root"

# path
[[blocks.segments]]
background = "p:darkblue"
foreground = "p:white"
powerline_symbol = ""
leading_powerline_symbol = ""
style = "powerline"
template = "{{ path .Path .Location }}"
type = "path"
max_depth = 5


[blocks.segments.options]
folder_icon = " "
folder_separator_icon = "<#011627></> "
home_icon = "  "
style = "agnoster_short"



# git related 
[[blocks.segments]]
background = "#addb67"
background_templates = [
  "{{ if or (.Working.Changed) (.Staging.Changed) }}rgb(228, 207, 106){{ end }}",
  "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f78c6c{{ end }}",
  "{{ if gt .Ahead 0 }}#C792EA{{ end }}",
  "{{ if gt .Behind 0 }}#c792ea{{ end }}",
]
foreground = "p:darkpurple"
powerline_symbol = ""
style = "powerline"
template = " {{ .UpstreamIcon }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
type = "git"
[blocks.segments.options]
branch_icon = " "
[blocks.segments.options.mapped_branches]



