'$schema' = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
console_title_template = "{{ .Folder }}"
final_space = true
version = 4

[palette]
black = '#262B44'
grey = '#333333'
lightblue = '#4B95E9'
green = '#0B6623'
blue = '#3333ff'
turquoise = '#59C9A5'
orange = '#F07623'
lightorange = '#F3AE35'
lightred = '#D81E5B'
red = '#ff3333'
white = '#E0DEF4'



[[blocks]]
alignment = "left"
type = "prompt"
[[blocks.segments]]
background = "#21c7a8"
foreground = "#011627"
leading_diamond = "╭─"
style = "diamond"
template = " {{ if .WSL }}WSL at {{ end }}{{.Icon}}  "
trailing_diamond = ""
type = "os"
[blocks.segments.options]
windows = ""
[[blocks.segments]]
background = "#ef5350"
foreground = "#ffeb95"
powerline_symbol = ""
style = "powerline"
template = "  "
type = "root"
[[blocks.segments]]
background = "#82AAFF"
foreground = "#011627"
powerline_symbol = ""
leading_powerline_symbol = ""
style = "powerline"
template = "{{ path .Path .Location }}"
type = "path"
[blocks.segments.options]
folder_icon = " "
folder_separator_icon = "<#011627></> "
home_icon = "  "
style = "agnoster"
[[blocks.segments]]
background = "#addb67"
background_templates = [
  "{{ if or (.Working.Changed) (.Staging.Changed) }}#e4cf6a{{ end }}",
  "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f78c6c{{ end }}",
  "{{ if gt .Ahead 0 }}#C792EA{{ end }}",
  "{{ if gt .Behind 0 }}#c792ea{{ end }}",
]
foreground = "#011627"
powerline_symbol = ""
style = "powerline"
template = " {{ .UpstreamIcon }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
type = "git"
[blocks.segments.options]
branch_icon = " "
[blocks.segments.options.mapped_branches]

[[blocks.segments]]
background = "#575656"
foreground = "#d6deeb"
leading_diamond = ""
style = "diamond"
template = " {{ .FormattedMs }}"
trailing_diamond = ""
type = "executiontime"
[blocks.segments.options]
style = "roundrock"
threshold = 0
[[blocks]]
alignment = "right"
overflow = "break"
type = "prompt"
[[blocks.segments]]
background = "#d6deeb"
foreground = "#011627"
leading_diamond = ""
style = "diamond"
template = "  {{ .Name }} "
trailing_diamond = ""
type = "shell"
[[blocks.segments]]
background = "#8f43f3"
foreground = "#ffffff"
leading_diamond = ""
style = "diamond"
template = " {{ round .PhysicalPercentUsed .Precision }}% "
trailing_diamond = ""
type = "sysinfo"
[[blocks.segments]]
background = "#ffffff"
foreground = "#ce092f"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "angular"
[[blocks.segments]]
background = "#ffffff"
foreground = "#de1f84"
leading_diamond = ""
style = "diamond"
template = "α {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "aurelia"
[[blocks.segments]]
background = "#565656"
foreground = "#faa029"
leading_diamond = ""
style = "diamond"
template = " {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} "
trailing_diamond = ""
type = "aws"
[[blocks.segments]]
background = "#ffffff"
foreground = "#337bb6"
leading_diamond = ""
style = "diamond"
template = " {{ .EnvironmentName }} "
trailing_diamond = ""
type = "az"
[[blocks.segments]]
background = "#ffffff"
foreground = "#5398c2"
leading_diamond = ""
style = "diamond"
template = "<#f5bf45></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "azfunc"
[[blocks.segments]]
background = "#5a7a94"
foreground = "#100e23"
leading_diamond = ""
style = "diamond"
template = "  cds {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "cds"
[[blocks.segments]]
background = "#ffffff"
foreground = "#000000"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "crystal"
[[blocks.segments]]
background = "#ffffff"
foreground = "#1d5185"
leading_diamond = ""
style = "diamond"
template = "  cf {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "cf"
[[blocks.segments]]
background = "#ffffff"
foreground = "#1d5185"
leading_diamond = ""
style = "diamond"
template = " {{if .Org }}{{ .Org }}{{ end }}{{ if .Space }}/{{ .Space }}{{ end }} "
trailing_diamond = ""
type = "cftarget"
[[blocks.segments]]
background = "#d2d2d2"
foreground = "#01a300"
leading_diamond = ""
style = "diamond"
template = "<#2829b2></> <#be1818></>  cmake {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "cmake"
[[blocks.segments]]
background = "#e1e8e9"
foreground = "#055b9c"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "dart"
[[blocks.segments]]
background = "#0e0e0e"
foreground = "#0d6da8"
leading_diamond = ""
style = "diamond"
template = "  {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "dotnet"
[[blocks.segments]]
background = "#06A4CE"
foreground = "#ffffff"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "flutter"
[[blocks.segments]]
background = "#ffffff"
foreground = "#06aad5"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "go"
[[blocks.segments]]
background = "#100e23"
foreground = "#906cff"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "haskell"
[[blocks.segments]]
background = "#ffffff"
foreground = "#ec2729"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "java"
[[blocks.segments]]
background = "#945bb3"
foreground = "#ffffff"
leading_diamond = ""
style = "diamond"
template = "<#ca3c34></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "julia"
[[blocks.segments]]
background = "#906cff"
foreground = "#ffffff"
leading_diamond = ""
style = "diamond"
template = "K {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "kotlin"
[[blocks.segments]]
background = "#316ce4"
foreground = "#ffffff"
leading_diamond = ""
style = "diamond"
template = " {{.Context}} :: {{if .Namespace}}{{.Namespace}}{{else}}default{{end}} "
trailing_diamond = ""
type = "kubectl"
[[blocks.segments]]
background = "#ffffff"
foreground = "#000081"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "lua"
[[blocks.segments]]
background = "#303030"
foreground = "#3C873A"
leading_diamond = ""
style = "diamond"
template = " {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} "
trailing_diamond = ""
type = "node"
[blocks.segments.options]
fetch_package_manager = true
npm_icon = "<#cc3a3a></> "
yarn_icon = "<#348cba></> "
[[blocks.segments]]
background = "#6488c0"
foreground = "#1e293b"
leading_diamond = ""
style = "diamond"
template = "Nx {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "nx"
[[blocks.segments]]
background = "#41436d"
foreground = "#ffffff"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "perl"
[[blocks.segments]]
background = "#787CB5"
foreground = "#000000"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "php"
[[blocks.segments]]
background = "#306998"
foreground = "#FFE873"
leading_diamond = ""
style = "diamond"
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}"
trailing_diamond = ""
type = "python"
[[blocks.segments]]
background = "#b9bbbf"
foreground = "#1c68bd"
leading_diamond = ""
style = "diamond"
template = "R {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "r"
[[blocks.segments]]
background = "#ffffff"
foreground = "#9c1006"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "ruby"
[[blocks.segments]]
background = "#ffffff"
foreground = "#000000"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "rust"
[[blocks.segments]]
background = "#fe562e"
foreground = "#ffffff"
leading_diamond = ""
style = "diamond"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "swift"
[[blocks.segments]]
background = "#234d70"
foreground = "#d6deeb"
leading_diamond = ""
style = "diamond"
template = " {{ .CurrentDate | date .Format }}"
trailing_diamond = ""
type = "time"
[blocks.segments.options]
time_format = "15:04:05"
[[blocks]]
alignment = "left"
newline = true
type = "prompt"
[[blocks.segments]]
foreground = "#21c7a8"
style = "plain"
template = "╰─"
type = "text"
[[blocks.segments]]
background = "#1DB954"
foreground = "#011627"
leading_diamond = ""
style = "diamond"
template = " {{ .Icon }}{{ if ne .Status \"stopped\" }}{{ .Artist }} ~ {{ .Track }}{{ end }} "
trailing_diamond = " "
type = "spotify"
[blocks.segments.options]
playing_icon = " "
[[blocks.segments]]
foreground = "#22da6e"
foreground_templates = ["{{ if gt .Code 0 }}#ef5350{{ end }}"]
style = "plain"
template = ""
type = "status"
[blocks.segments.options]
always_enabled = true
[transient_prompt]
background = "transparent"
foreground = "#d6deeb"
template = " "
