'$schema' = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
console_title_template = "{{ .Folder }}"
final_space = true
version = 4

[palette]
black = '#000000'
darkblue = '#262B44'
grey = '#333333'
green = '#0B6623'
blue = '#3333ff'
lightblue = '#4B95E9'
turquoise = '#21c7a8'
orange = '#F07623'
lightorange = '#F3AE35'
offyellow = '#E4CF6A'
red = '#ff3333'
darkpurple = '#011627'
white = '#E0DEF4'
lighttan = '#FFEB95'

# theme
themeprimarydark = '#262B44'
themeprimarylight = '#FFEB95'


[[blocks]]
alignment = "left"
type = "prompt"

[[blocks.segments]]
background = "p:darkblue"
foreground = "p:themeprimarylight"
leading_diamond = "╭─"
style = "diamond"
template = " {{ if .WSL }}WSL at {{ end }}{{.Icon}}  "
trailing_diamond = ""
type = "os"
[blocks.segments.options]
windows = ""

[[blocks.segments]]
background = "p:white"
foreground = "p:darkblue"
powerline_symbol = ""
style = "powerline"
template = "  "
type = "root"

# path
[[blocks.segments]]
background = "transparent"
foreground = "p:themeprimarylight"
powerline_symbol = ""
leading_powerline_symbol = ""
style = "powerline"
# template = "{{ path .AbsolutePWD .Location }}"
template = "{{ path .PWD .Location }}"
type = "path"
hide_root_location = true


[blocks.segments.options]
folder_icon = " "
folder_separator_icon = "<#011627></> "
home_icon = "  "
style = "agnoster_short"
max_depth = 3


# git related 
[[blocks.segments]]
background = "#addb67"
background_templates = [
  "{{ if or (.Working.Changed) (.Staging.Changed) }}rgb(228, 207, 106){{ end }}",
  "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f78c6c{{ end }}",
  "{{ if gt .Ahead 0 }}#C792EA{{ end }}",
  "{{ if gt .Behind 0 }}#c792ea{{ end }}",
]
foreground = "p:darkpurple"
powerline_symbol = ""
style = "powerline"
template = " {{ .UpstreamIcon }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
type = "git"
[blocks.segments.options]
branch_icon = " "
[blocks.segments.options.mapped_branches]


# execution time 
[[blocks.segments]]
background = "#575656"
foreground = "#d6deeb"
leading_diamond = ""
style = "diamond"
template = " {{ .FormattedMs }}"
trailing_diamond = ""
type = "executiontime"
[blocks.segments.options]
style = "roundrock"
threshold = 0


# [[blocks]]
# alignment = "right"
# overflow = "break"
# type = "prompt"

# [[blocks.segments]]
# background = "#8f43f3"
# foreground = "#ffffff"
# leading_diamond = ""
# style = "diamond"
# template = " {{ round .PhysicalPercentUsed .Precision }}% "
# trailing_diamond = ""
# type = "sysinfo"


[[blocks]]
alignment = "left"
newline = true
type = "prompt"

[[blocks.segments]]
foreground = "#21c7a8"
style = "plain"
template = "╰─"
type = "text"

[blocks.segments.options]
playing_icon = " "

[[blocks.segments]]
foreground = "#22da6e"
foreground_templates = ["{{ if gt .Code 0 }}#ef5350{{ end }}"]
style = "plain"
template = ""
type = "status"
[blocks.segments.options]
always_enabled = true


[transient_prompt]
background = "transparent"
foreground = "p:themeprimarylight"
template = " "
