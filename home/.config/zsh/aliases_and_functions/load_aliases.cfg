# this is the main file that should be loaded

#typeset -A alias_files

alias_files=(
    archive
    atuin
    docker
    dust
    file
    git
    list
    micro
    misc
	nav
    nix
    pnpm
    suvadu
	system
    yt
)


function_files=(
    atuin
    suvadu
)

# Loads alias files
for alias_file in ${alias_files[@]}; do
    . "$zsh_aliases_dir/${alias_file}_aliases.zsh"
done

# Loads function files for various tools
for function_file in ${function_files[@]}; do
    . "$zsh_aliases_dir/${function_file}_functions.zsh"
done
