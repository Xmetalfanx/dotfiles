[[blocks]]
alignment = "left"
newline = true
type = "prompt"

[[blocks.segments]]
foreground = "#21c7a8"
style = "plain"
template = "╰─"
type = "text"

[[blocks.segments]]
background = "#1DB954"
foreground = "#011627"
leading_diamond = ""
style = "diamond"
template = " {{ .Icon }}{{ if ne .Status \"stopped\" }}{{ .Artist }} ~ {{ .Track }}{{ end }} "
trailing_diamond = " "
type = "spotify"

[blocks.segments.options]
playing_icon = " "

[[blocks.segments]]
foreground = "#22da6e"
foreground_templates = ["{{ if gt .Code 0 }}#ef5350{{ end }}"]
style = "plain"
template = ""
type = "status"
[blocks.segments.options]
always_enabled = true


[transient_prompt]
background = "transparent"
foreground = "#d6deeb"
template = " "
